name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-build-test:
    name: Lint, build & test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # postinstall runs `electron-builder install-app-deps`, which compiles
      # native addons against Electron headers. All three hosted runners ship
      # the toolchains node-gyp needs.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type-check & build
        run: npm run build

      - name: Run tests
        run: npx vitest run